project:
  random_seed: 42
  log_level: INFO

paths:
  output_dir: results
  cache_dir: cache
  input_dir: data/input
  standard_nucleotides_dir: data/reference/std_nucleotides
  pfoa_ligand_pdbqt: data/input/pfoa_ligand.pdbqt

tools:
  # Set these environment variables before running external-tool stages.
  simrna_dir: ${SIMRNA_DIR}
  mgltools_dir: ${MGLTOOLS_DIR}
  vina_gpu_dir: ${VINA_GPU_DIR}
  vina_gpu_executable: AutoDock-Vina-GPU-2-1
  pymol_executable: pymol
  vienna_dna_parameter_file: dna_mathews2004.par

library:
  alphabet: [A, C, G, T]
  initial_length: 10
  additional_rounds: 2
  stability_requires_base_pair: true
  threshold_sigma: 1.5

initial_clustering:
  sequence_ngram_range: [3, 5]
  structure_ngram_range: [2, 4]
  sequence_features: 500
  structure_features: 50
  umap_components: 3
  umap_metric: cosine
  umap_neighbors: 30
  umap_min_dist: 0.0
  hdbscan_min_samples: 5
  hdbscan_selection_method: eom

simrna:
  replicas: 5
  initial_temperature: 1.35
  final_temperature: 0.90
  iterations_per_replica: 50000
  trajectory_stride: 5000
  secondary_structure_weight: 5.0
  representative_clusters: 3

docking:
  search_depth: 50
  num_modes: 1
  gpu_threads: 1024
  box_extension_angstrom: 10.0

evolution:
  first_round: 12
  last_round: 24
  phase1_last_round: 17
  phase1_rounds_per_module: 3
  threshold_sigma: 1.5

multimodal:
  # Round 22 was selected from the mean/minimum BE trajectory and yields 23-nt candidates.
  candidate_round: 22
  candidate_file: selected_candidates.jsonl
  expected_sequence_length: 23
  image_size: 224
  views: [front, right, back, bottom, top, left]
  graph_distance_angstrom: 8.0
  batch_size: 8
  epochs: 200
  learning_rate: 0.0001
  weight_decay: 0.000001
  temperature: 0.5
  dropout: 0.3
  embedding_dim: 128
  l2_normalize: true
  umap_components: 10
  umap_metric: cosine
  umap_neighbors: 15
  umap_min_dist: 0.0
  hdbscan_min_cluster_size: 5
  hdbscan_small_pool_threshold: 50
  hdbscan_small_pool_min_cluster_size: 3
  hdbscan_min_samples: 2
  hdbscan_selection_method: eom

motif_engineering:
  primary_motif: CGCGCTTCGGCGCG
