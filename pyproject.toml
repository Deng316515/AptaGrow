[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aptagrow"
version = "1.0.0"
description = "Data-independent de novo aptamer generation and screening pipeline"
readme = "README.md"
requires-python = ">=3.9,<3.11"
dependencies = [
  "numpy==1.23.5",
  "scipy==1.10.1",
  "pandas==1.5.3",
  "scikit-learn==1.2.2",
  "umap-learn==0.5.5",
  "hdbscan==0.8.33",
  "PyYAML==6.0.1",
  "tqdm==4.66.1",
  "matplotlib==3.7.2",
  "Pillow==10.0.1",
]

[project.optional-dependencies]
multimodal = [
  "torch==2.0.1",
  "torchvision==0.15.2",
  "torch-geometric==2.3.1",
]
test = ["pytest==7.4.4"]

[project.scripts]
aptagrow = "aptagrow.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
